<script>
const data=[
["探究学習 リサーチプロポーザル｜言語学・AI・行動科学","人間っぽいAI、<br>AIっぽい人間!?","— 生成AI普及前後の文集比較から検証する —","滝川高校 高Ⅱ年2組｜発表者：江藤 夢馬"],
["01. 動機と背景","研究背景：AI検知ツールの現実",'<div class="grid2"><div class="card"><span class="pill">きっかけ</span><h3>AI判定を根拠にした問題</h3><p>ChatGPTの判断を根拠に、学生が不正利用を疑われ大きな問題になった。</p></div><div class="card pink"><h3 class="red">人間が書いた文章がAI扱いされる</h3><p>「人間らしさの基準」そのものが揺らいでいる。</p></div></div>'],
["02. 問題意識","発展させた探究の視点",'<div class="center"><div class="sub">従来の問い</div><div class="lead">AIの文章をどう見分けるか？</div><div class="lead blue">↓ お互いの書き方がどのように影響し合って変化しているのか？</div></div>'],
["03. 研究仮説","仮説：双方向の相互接近（共進化モデル）",'<div class="grid2"><div class="card"><h3>AI → 人間への接近</h3><p>モデルの進化により、より自然で人間らしい表現に。</p></div><div class="card pink"><h3>人間 → AIへの接近</h3><p>AIの文章に触れることで、AIっぽい構文や語彙を無意識に真似する可能性。</p></div></div>'],
["04. 先行研究の整理","明確になっている事実①：構造差と日本語の特徴",'<div class="grid2"><div class="card"><span class="pill">PMC研究（2023）</span><h3>構文・語彙の構造的違い</h3><p>AI文は名詞化率が高く、論理構造が整然としている。</p></div><div class="card"><span class="pill">PMC日本語分析</span><h3>日本語固有の品詞特徴</h3><p>助詞の頻度や読点の位置に傾向差が存在する。</p></div></div>'],
["04. 先行研究の整理","明確になっている事実②：バラツキと急速な接近",'<div class="grid2"><div class="card"><h3>文章の分散・多様性</h3><p>人間文は文長やリズムのばらつきが大きく、LLM文は均一化しやすい。</p></div><div class="card"><h3>NIST GenAI（2024）</h3><p>生成AIによる要約文は、人間の文章へ接近している。</p></div></div>'],
["05. 議論の対立","識別能力に関する見解の対立",'<div class="grid2"><div class="card"><h3>識別困難の立場</h3><p>専門的な文章では大学講師でも正答率57%。</p></div><div class="card pink"><h3>高精度識別の立場</h3><p>日常的なAI利用者は微妙な違和感を捉えられるという研究もある。</p></div></div>'],
["06. 探究課題（GAPS）","先行研究における2つの未解明課題",'<div class="grid2"><div class="card pink"><div class="metric red">GAP 01</div><h3>人間側の文章変容</h3><p>AI利用習慣に伴う人間文体の「AI化」傾向。</p></div><div class="card"><div class="metric">GAP 02</div><h3>人間らしさの基準</h3><p>自然さ・分かりやすさ・オリジナリティの判断指標。</p></div></div>'],
["07. 研究目的","中心となる2つの問い",'<div class="question"><span class="blue">問い ①</span><br>AI文章と人間が書いた文章の言語的特徴（文長・語彙・記号）の差は何か？</div><div class="question redline"><span class="red">問い ②（本研究の核心）</span><br>AI普及前後で、人間の文章スタイル自体がAIへ接近しているか？</div>'],
["08. 検証方法","比較対象データの選定",'<div class="grid3"><div class="card"><h3>2022年以前の文</h3><p>Wikipedia過去記事（人間文）</p></div><div class="card pink"><h3>最新の文章</h3><p>Wikipedia最新記事（AI普及後）</p></div><div class="card"><h3>AI生成文</h3><p>最新LLMによる生成文章</p></div></div>'],
["08. 検証ロジック","データ比較による影響度検証のフレームワーク",'<div class="grid2"><div class="card"><h3>2022年以前の文</h3><p>AI普及前の比較基準</p></div><div class="card"><h3>最新の文章</h3><p>AI普及後の人間文</p></div></div><div class="lead center">それぞれをAI生成文との距離で比較する</div>'],
["08. 検証方法","分析で使用する定量指標",'<div class="grid3"><div class="card"><div class="metric">01</div><h3>文長分散</h3><p>文ごとの長さのばらつき・リズム感。</p></div><div class="card"><div class="metric">02</div><h3>語彙多様性（TTR）</h3><p>ユニーク単語の割合。</p></div><div class="card"><div class="metric">03</div><h3>文字種・記号比率</h3><p>句読点や文字種の頻度。</p></div></div>'],
["08. 検証方法","ユニーク単語とは？",'<div class="grid2"><div class="card"><h3>例文</h3><div class="lead">私は猫が好きです。<br>なぜなら、猫は可愛いからです。</div></div><div class="card"><h3>単語を数える</h3><p>「私」「は」「猫」「が」「好き」「です」「なぜなら」「可愛い」「から」</p><div class="metric">TTR</div><p>ユニーク単語数 ÷ トークン数</p></div></div>'],
["08. 検証方法","使用したテーマ",'<div class="grid2"><div class="card"><div class="lead">🌿 光合成</div></div><div class="card"><div class="lead">✦ 生成AI</div></div></div><p class="sub center">旧Wikipedia・最新Wikipedia・AI生成文を比較</p>'],
["08. 検証結果","光合成：結果① 文長分散",'<div class="split"><div class="explain"><div class="metric">01</div><h3>文長分散</h3>文ごとの文字数や単語数のばらつき。</div><table class="table"><tr><th>指標</th><th>文長分散</th></tr><tr><td>旧Wiki</td><td>651.06</td></tr><tr><td>最新Wiki</td><td>632.89</td></tr><tr><td>生成AI</td><td><b>104.83</b></td></tr></table></div>'],
["08. 検証結果","光合成：結果② TTR",'<div class="split"><div class="explain"><div class="metric">02</div><h3>語彙多様性（TTR）</h3>総単語数に対するユニーク単語の割合。</div><table class="table"><tr><th>指標</th><th>TTR</th></tr><tr><td>旧Wiki</td><td>37.73%</td></tr><tr><td>最新Wiki</td><td>37.64%</td></tr><tr><td>生成AI</td><td>36.97%</td></tr></table></div>'],
["08. 検証結果","光合成：結果③ 文字種・記号比率",'<div class="center"><div class="lead">文字種・記号の構成を比較</div><p class="sub">漢字・ひらがな・カタカナ・英字・数字・記号など</p><p class="sub">※元PDF掲載図の見た目をHTMLで再構成した概形。</p></div>'],
["08. 検証方法","追加で確認したデータ",'<div class="center"><div class="lead">Generative AI のWikipedia記事</div><div class="metric red">31回</div><div class="sub">PDF内の注記：「31回しか変更されていない」</div></div>'],
["08. 検証結果","Generative AI：結果① 文長分散",'<div class="split"><div class="explain"><div class="metric">01</div><h3>文長分散</h3>文ごとの長さのばらつき。</div><table class="table"><tr><th>指標</th><th>文長分散</th></tr><tr><td>旧Wiki</td><td>33.670</td></tr><tr><td>最新Wiki</td><td>2.582</td></tr><tr><td>生成AI</td><td>10.749</td></tr></table></div>'],
["08. 検証結果","Generative AI：結果② TTR",'<div class="split"><div class="explain"><div class="metric">02</div><h3>語彙多様性（TTR）</h3>総単語数に対するユニーク単語の割合。</div><table class="table"><tr><th>指標</th><th>TTR</th></tr><tr><td>旧Wiki</td><td>58.8%</td></tr><tr><td>最新Wiki</td><td>63.2%</td></tr><tr><td>生成AI</td><td>68.0%</td></tr></table></div>'],
["08. 検証結果","Generative AI：結果③ 文字種・記号比率",'<div class="center"><div class="lead">文字種・記号の構成を比較</div><p class="sub">漢字・ひらがな・カタカナ・英字・数字・記号など</p><p class="sub">※元PDF掲載図の見た目をHTMLで再構成した概形。</p></div>'],
["08. 検証まとめ","研究のまとめ",'<div class="center"><div class="lead">2つのテーマで、文章の特徴を<br>3つの定量指標から比較した。</div><div class="grid3"><div class="card"><h3>文長分散</h3><p>文の長さのばらつき</p></div><div class="card"><h3>TTR</h3><p>語彙の多様性</p></div><div class="card"><h3>文字種・記号</h3><p>文字構成の傾向</p></div></div><p class="sub">※元PDFでは具体的なまとめ文は記載されていないため、分析項目の整理として構成。</p></div>'],
["08. 検証まとめ","探究を通じて得た学び・今後の展望",'<div class="center"><div class="lead">「人間らしさ」は、<br>単一の数値だけでは捉えきれない。</div><div class="question">文章の特徴を定量的に比較することと、読み手が感じる自然さを考えること。その両方が重要になる。</div><p class="sub">今後は、データ数・比較条件・評価方法をさらに検討する。</p><p class="sub">※元PDFに具体的な記述がないため補助的に追加。</p></div>'],
["参考文献","References",'<div class="sub">Iyer et al. (2025) — 2024 NIST GenAI (Pilot Study): Text-to-Text Evaluation Overview and Results<br><br>Lee et al. (2024) — 2024 Generative AI (GenAI): Evaluation Plan for Text-to-Text Discriminators<br><br>Lambert (2025) — Reinforcement Learning from Human Feedback<br><br>Ouyang et al. (2022) — Training Language Models to Follow Instructions with Human Feedback<br><br>Brown et al. (2020) — Language Models are Few-Shot Learners<br><br>AI Incident Database (2023) — Incident 538: Texas A&amp;M-Commerce Professor Reportedly Used ChatGPT...</div>']
];
const deck=document.getElementById('deck'),thumbnailList=document.getElementById('thumbnail-list');
data.forEach((d,i)=>{const s=document.createElement('section');s.className='slide'+(i===0?' active cover':'');s.innerHTML='<div class="eyebrow">'+d[0]+'</div>'+(i===0?'<div class="title">'+d[1]+'</div><div class="sub">'+d[2]+'</div><div class="rule"></div><div class="lead">'+d[3]+'</div>':'<h1 class="heading">'+d[1]+'</h1><div class="body">'+d[2]+'</div>')+'<div class="footer"><span>AIと人間の文章比較研究</span><span>'+String(i+1).padStart(2,'0')+' / '+data.length+'</span></div>';deck.appendChild(s);const thumb=document.createElement('button');thumb.className='thumbnail'+(i===0?' active':'');thumb.type='button';thumb.dataset.index=i;thumb.setAttribute('aria-label',(i+1)+'枚目: '+d[1].replace(/<[^>]*>/g,''));thumb.innerHTML='<span class="thumbnail-number">'+String(i+1).padStart(2,'0')+'</span><span class="thumbnail-page"><span class="thumbnail-kicker">'+d[0]+'</span><span class="thumbnail-title">'+d[1]+'</span><span class="thumbnail-rule"></span><span class="thumbnail-body">'+d[2].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()+'</span></span>';thumbnailList.appendChild(thumb)});document.getElementById('thumbnail-count').textContent=data.length+'枚';
(()=>{const slides=[...document.querySelectorAll('.slide')],thumbnails=[...document.querySelectorAll('.thumbnail')],counter=document.getElementById('counter'),progress=document.getElementById('progress');let index=0;function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index));thumbnails.forEach((t,i)=>{const active=i===index;t.classList.toggle('active',active);t.setAttribute('aria-current',active?'true':'false')});thumbnails[index]?.scrollIntoView({block:'nearest'});counter.textContent=(index+1)+' / '+slides.length;progress.style.width=((index+1)/slides.length*100)+'%';document.title=(index+1)+'/'+slides.length+' | 人間っぽいAI、AIっぽい人間!?'}thumbnails.forEach((t,i)=>t.onclick=()=>show(i));document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});let x=0;document.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-x;if(Math.abs(dx)>55)show(index+(dx<0?1:-1))},{passive:true});show(0)})();
</script></body></html>
