<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIと人間の双方向接近 Diagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }

        /* パルス＆収束アニメーション */
        @keyframes pulse-left {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }
        @keyframes pulse-right {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-8px); }
        }

        .animate-arrow-left {
            animation: pulse-left 2s ease-in-out infinite;
        }
        .animate-arrow-right {
            animation: pulse-right 2s ease-in-out infinite;
        }

        /* スライドのトーンに合わせたドロップシャドウ */
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 82, 204, 0.08), 0 8px 10px -6px rgba(0, 82, 204, 0.04);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- メイン図解コンテナ（スライド枠ではなく純粋な図解カード） -->
    <div class="w-full max-w-4xl bg-white rounded-3xl p-6 sm:p-12 card-shadow border border-blue-50/80 relative overflow-hidden">
        
        <!-- 背景の装飾エレメント（スライドのトーンに合わせた幾何学感） -->
        <div class="absolute -top-24 -left-24 w-60 h-60 bg-blue-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-red-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

        <div class="grid grid-cols-1 md:grid-cols-11 gap-6 md:gap-2 items-center relative z-10">

            <!-- 1. 左側：人間（Human） -->
            <div class="md:col-span-4 flex flex-col items-center justify-center p-6 sm:p-8 bg-red-50/40 rounded-2xl border-2 border-red-100/80 transition-all hover:border-red-200">
                <!-- 人間アイコン（スライドの赤色アイコン #D32F2F / #E53935 に準拠） -->
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-red-500/10 flex items-center justify-center mb-4 text-red-600">
                    <svg class="w-12 h-12 sm:w-14 sm:h-14 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <!-- テキスト：人間 のみ -->
                <span class="text-2xl sm:text-3xl font-black text-gray-800 tracking-wide">人間</span>
            </div>

            <!-- 2. 中央：お互いに近づく双方向矢印 -->
            <div class="md:col-span-3 flex flex-col sm:flex-row md:flex-col items-center justify-center py-4 sm:py-0 gap-4">
                
                <div class="w-full flex items-center justify-center gap-2 sm:gap-3 px-2">
                    <!-- 左から右（人間 → AI）への矢印 -->
                    <div class="flex-1 flex items-center animate-arrow-left">
                        <div class="h-1.5 sm:h-2 w-full bg-gradient-to-r from-red-500 to-blue-500 rounded-l-full"></div>
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 -ml-1 text-blue-500 fill-current shrink-0" viewBox="0 0 24 24">
                            <path d="M5 3l14 9-14 9V3z"/>
                        </svg>
                    </div>

                    <!-- 右から左（AI → 人間）への矢印 -->
                    <div class="flex-1 flex items-center animate-arrow-right">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 -mr-1 text-red-500 fill-current shrink-0 transform rotate-180" viewBox="0 0 24 24">
                            <path d="M5 3l14 9-14 9V3z"/>
                        </svg>
                        <div class="h-1.5 sm:h-2 w-full bg-gradient-to-r from-blue-500 to-red-500 rounded-r-full"></div>
                    </div>
                </div>

                <!-- 中央の接触・交差を示すノードマーク -->
                <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-red-500 to-blue-600 ring-4 ring-blue-50 animate-ping hidden md:block"></div>

            </div>

            <!-- 3. 右側：AI -->
            <div class="md:col-span-4 flex flex-col items-center justify-center p-6 sm:p-8 bg-blue-50/50 rounded-2xl border-2 border-blue-100/80 transition-all hover:border-blue-200">
                <!-- AIロボットアイコン（スライドのディープブルー #0052CC に準拠） -->
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-blue-600/10 flex items-center justify-center mb-4 text-blue-600">
                    <svg class="w-12 h-12 sm:w-14 sm:h-14 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                        <circle cx="8.5" cy="16" r="1.5" fill="currentColor"></circle>
                        <circle cx="15.5" cy="16" r="1.5" fill="currentColor"></circle>
                        <path d="M12 2v7"></path>
                        <path d="M8 2h8"></path>
                    </svg>
                </div>
                <!-- テキスト：AI のみ -->
                <span class="text-2xl sm:text-3xl font-black text-gray-800 tracking-wide">AI</span>
            </div>

        </div>

    </div>

</body>
</html>
